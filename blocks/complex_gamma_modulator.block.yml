    - set_as_real(${ as_real })
    - set_drift_pct(${ drift_pct })
    - set_gamma0_mag(${ gamma0_mag })
    - set_gamma0_phase_deg(${ gamma0_phase_deg })
    - set_gamma1_mag(${ gamma1_mag })
    - set_gamma1_phase_deg(${ gamma1_phase_deg })
    - set_jitter_samples(${ jitter_samples })

